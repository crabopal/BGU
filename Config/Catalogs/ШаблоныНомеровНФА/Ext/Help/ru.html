<h1>Шаблоны номеров НФА</h1>
<p>Используется для задания шаблона автоматического формирования номеров НФА, например: инвентарных номеров объектов, номеров инвентарных карточек.</p>
<p>Шаблон задается в учетной политике организации на закладке "ОС, НМА, НПА".</p></body></html>
