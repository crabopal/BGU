<h1 class="">Причины списания НФА</h1>
<p style="margin-left: 0px">Справочник предназначен для хранения списка причин списания НФА.</p>
<p style="margin-left: 0px">Используется при печати актов списания нефинансовых активов.<br><br>Для вызова справочника можно использовать команду <b>Причины списания НФА</b> меню функций раздела <b>ОС, НМА, НПА</b>.  </p>
