<h1>Обработка "Формирование писем по квитанциям на оплату"</h1>
<p>Обработка позволяет по документам "Квтинация на оплату" сформировать выбранную печатную форму и сформировать письмо во встроенном почтовом клиенте, которое будет отправлено плательщику на его электронную почту.</p></body></html>
