<h1 class="">Фамилия, имя, отчество физического лица</h1>
<p style="margin-left: 0px">Хранит историю изменений фамилии, имени и отчества физических лиц.</p>
<p style="margin-left: 0px">Может редактироваться как в списке, так и через соответствующие поля справочников <a href="Catalog.ФизическиеЛица/Help">Физические лица</a> и <a href="Catalog.Контрагенты/Help">Контрагенты</a>.</p>
